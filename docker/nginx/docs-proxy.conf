server {
    listen 80;
    server_name localhost;
    charset utf-8;
    client_max_body_size 100m;

    # Re-resolve compose service names so recreates do not stick nginx to a dead IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $docs_app http://docs-app:8000;
        proxy_pass $docs_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collaboration/ {
        set $docs_y_provider http://docs-y-provider:4444;
        proxy_pass $docs_y_provider;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location / {
        set $docs_frontend http://docs-frontend:3000;
        proxy_pass $docs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
