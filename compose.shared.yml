services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_DB: lasuite
      POSTGRES_USER: dinum
      POSTGRES_PASSWORD: pass
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01_init_databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinum -d lasuite"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - "1081:1080"

  minio:
    user: ${DOCKER_USER:-1000}
    image: quay.io/minio/minio
    environment:
      MINIO_ROOT_USER: lasuite
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 20s
      retries: 30
    entrypoint: ""
    command: minio server --console-address :9001 /data
    volumes:
      - ./data/media:/data

  createbuckets:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    restart: on-failure

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    env_file:
      - env/keycloak
    command:
      - start-dev
      - --features=preview
      - --import-realm
      - --hostname-strict=false
      - --health-enabled=true
      - --metrics-enabled=true
    volumes:
      - ./docker/auth/impress.json:/opt/keycloak/data/import/impress.json:ro
      - ./docker/auth/meet.json:/opt/keycloak/data/import/meet.json:ro
      - ./docker/auth/dictaphone.json:/opt/keycloak/data/import/dictaphone.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/localhost/9000; echo -e "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep "HTTP/1.1 200 OK" <&3',
        ]
      start_period: 20s
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy

  nginx:
    image: nginx:1.25
    ports:
      - "8083:8083"
    volumes:
      - ./docker/nginx/keycloak.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      keycloak:
        condition: service_healthy
      docs-app:
        condition: service_started

  dockerize:
    image: jwilder/dockerize
    platform: linux/amd64
    profiles: ["tools"]

volumes:
  postgres-data:
